name: Build ZTE Router Studio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Optimized APK
        run: gradle assembleRelease

      - name: Prepare Direct APK
        run: cp app/build/outputs/apk/release/app-release.apk ZteRouterStudio.apk

      - name: Publish Direct APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ZteRouterStudio.apk --clobber
          else
            gh release create latest ZteRouterStudio.apk --title "Latest APK Build" --notes "Direct APK download without ZIP"
          fi